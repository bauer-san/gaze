# Example configuration. Copy to config.yaml and edit; CLI flags override these.
#
#   python3 demo.py --config config.yaml

# --- camera ---------------------------------------------------------------
source: realsense       # realsense | webcam | kinect | jetson | gst:<pipeline>
device: 0               # V4L2/CSI index (webcam and jetson sources)
# serial:               # pin a specific RealSense by serial number
camera_width: 640
camera_height: 480
fps: 30

# --- display --------------------------------------------------------------
screen_w: 1280
screen_h: 720
fullscreen: false
headless: false         # no window; annunciate through the log
tui: false              # no window; prompts and a status line in the terminal.
                        # Unlike headless it can run the calibration, so this
                        # is the one to use over ssh.
debug: false            # verbose logs, camera inset, zone coordinates

# --- attention thresholds (seconds) ---------------------------------------
# Glancing at the feed table is normal, so there is a grace period before
# warning. alert_after is the point at which the operator is treated as having
# genuinely lost track of the blade.
warn_after: 1.0
alert_after: 3.0

# The gaze must be continuously back inside the area for this long before an
# alarm clears, so the state does not flicker at the zone edge.
clear_after: 0.4

# Unusable camera frames for this long is a fault. Faults alarm: a monitor
# that goes quiet when it breaks is worse than no monitor.
fault_after: 1.0

# Tolerance around the calibrated area, as a fraction of its size.
zone_margin: 0.1

# A covered lens keeps delivering frames, so nothing else notices it. Below
# this fraction of depth pixels carrying a reading, with no face in view, the
# camera is treated as blinded and escalates to SENSOR FAULT after
# fault_after. Measured: ~0.88-0.98 with the lens clear, ~0.00-0.01 covered.
# Set to 0 to disable. Ignored by cameras with no depth (webcam, CSI).
min_depth_fraction: 0.05

# --- metrics --------------------------------------------------------------
# Prometheus exporter. 0 disables it. Counters here (zone re-entries, state
# transitions) survive a slow scrape, which the state-change log does not: a
# glance back shorter than clear_after changes no state and writes no line.
metrics_port: 9091

# --- safety output --------------------------------------------------------
# Optional, and off as shipped. When configured, the monitor continuously
# writes a *run permit* to a machine controller over Modbus/TCP -- it does not
# send a stop command. Loss of contact therefore means stop, so a crash, a
# hung process or a cut cable all result in the machine not being permitted.
#
# That only works if the far end treats loss of communication as a demand to
# stop. Confirm that by pulling the cable and watching the machine stop.
#
# brake_after is deliberately separate from warn_after/alert_after, so the
# operator-facing thresholds can be tuned without moving the number that
# stops a machine. 0 disables the output entirely.
brake_after: 0.0
brake_on_fault: false      # a fouled lens should usually be loud, not stopping

safety_host: ""            # empty disables; 127.0.0.1 for a loopback test
safety_port: 502
safety_unit_id: 1
safety_kind: coil          # coil (FC05) or register (FC06)
safety_address: 0
safety_interval: 0.1       # seconds between permit renewals
safety_stale_after: 0.5    # vision result older than this stops renewals

# Issue permits without first proving the machine cannot run. Leave false:
# arming automatically after a crash is what a safety output must not do.
# Arm deliberately instead, with SIGUSR1.
safety_auto_arm: false

# Gaze smoothing (0-1]. Lower is steadier but slower to react.
filter_alpha: 0.12

# --- calibration ----------------------------------------------------------
# Commissioning only: the four corners are captured once and reloaded on every
# start. Redo with --recalibrate, discard with --factory-reset.
sample_duration: 1.0    # seconds of fixation per corner
sigma_threshold: 0.05   # reject a corner that wobbles more than this
# calibration_file: /var/lib/gaze_monitor/calibration.json
