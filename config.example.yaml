# Example configuration. Copy to config.yaml and edit; CLI flags override these.
#
#   python3 demo.py --config config.yaml

# --- camera ---------------------------------------------------------------
source: realsense       # realsense | webcam | kinect | jetson | gst:<pipeline>
device: 0               # V4L2/CSI index (webcam and jetson sources)
# serial:               # pin a specific RealSense by serial number
camera_width: 640
camera_height: 480
fps: 30

# --- display --------------------------------------------------------------
screen_w: 1280
screen_h: 720
fullscreen: false
headless: false         # no window; annunciate through the log
tui: false              # no window; prompts and a status line in the terminal.
                        # Unlike headless it can run the calibration, so this
                        # is the one to use over ssh.
debug: false            # verbose logs, camera inset, zone coordinates

# --- attention thresholds (seconds) ---------------------------------------
# Glancing at the feed table is normal, so there is a grace period before
# warning. alert_after is the point at which the operator is treated as having
# genuinely lost track of the blade.
warn_after: 1.0
alert_after: 3.0

# The gaze must be continuously back inside the area for this long before an
# alarm clears, so the state does not flicker at the zone edge.
clear_after: 0.4

# Unusable camera frames for this long is a fault. Faults alarm: a monitor
# that goes quiet when it breaks is worse than no monitor.
fault_after: 1.0

# Tolerance around the calibrated area, as a fraction of its size.
zone_margin: 0.1

# A covered lens keeps delivering frames, so nothing else notices it. Below
# this fraction of depth pixels carrying a reading, with no face in view, the
# camera is treated as blinded and escalates to SENSOR FAULT after
# fault_after. Measured: ~0.88-0.98 with the lens clear, ~0.00-0.01 covered.
# Set to 0 to disable. Ignored by cameras with no depth (webcam, CSI).
min_depth_fraction: 0.05

# --- metrics --------------------------------------------------------------
# Prometheus exporter. 0 disables it. Counters here (zone re-entries, state
# transitions) survive a slow scrape, which the state-change log does not: a
# glance back shorter than clear_after changes no state and writes no line.
metrics_port: 9091

# --- live landmark preview -------------------------------------------------
# A demonstration and commissioning aid, off as shipped. When a port is set,
# the annotated camera image is served over HTTP:
#
#     http://<host>:8080/            the live view
#     http://<host>:8080/frame.jpg   one snapshot
#     http://<host>:8080/landmarks.json   the points as numbers
#
# Read this before enabling it: there is no authentication, and what it serves
# is live video of whoever is standing in front of the camera. It is for
# proving the mesh tracks during commissioning, and for putting the tracking
# on a second screen during a demonstration. It is not for an installed
# machine. Set preview_bind to 127.0.0.1 to require an ssh tunnel instead.
#
# It cannot slow the monitor down, which matters because the same loop drives
# the safety output. The capture loop only copies a frame (0.08 ms), and only
# while somebody is watching; drawing and JPEG encoding run on the HTTP
# threads. A viewer that cannot keep up drops frames rather than applying any
# backpressure.
preview_port: 0            # e.g. 8080; 0 disables
preview_bind: 0.0.0.0      # 127.0.0.1 to require an ssh tunnel
preview_draw: contours     # none | irises | contours | mesh
preview_quality: 80        # JPEG quality
preview_max_fps: 10.0      # cap per viewer; 0 removes the cap

# --- safety output --------------------------------------------------------
# Optional, and off as shipped. When configured, the monitor continuously
# writes a *run permit* to the machine -- it does not send a stop command.
# Loss of contact therefore means stop, so a crash, a hung process or a
# pulled cable all result in the machine not being permitted.
#
# That only works if the far end treats loss of contact as a demand to stop.
# Confirm it by pulling the cable and watching the machine stop, not by
# reading a configuration page.
#
# brake_after is deliberately separate from warn_after/alert_after, so the
# operator-facing thresholds can be tuned without moving the number that
# stops a machine. 0 disables the output entirely.
brake_after: 0.0
brake_on_fault: false      # a fouled lens should usually be loud, not stopping

# How the permit gets there:
#   tcp    Modbus/TCP           -- safety_host, safety_port
#   rtu    Modbus RTU, serial   -- safety_serial_port and the line settings
#   relay  USB relay module     -- safety_serial_port, one dry contact,
#                                  no protocol and no addresses
safety_transport: tcp

safety_host: ""            # tcp only; empty disables; 127.0.0.1 to loop back
safety_port: 502

# rtu and relay. Line settings apply to rtu; a CDC-ACM relay ignores baud.
safety_serial_port: ""     # e.g. /dev/ttyUSB0 (rtu) or /dev/ttyACM0 (relay)
safety_baud: 9600
safety_parity: N           # N, E or O
safety_stopbits: 1
safety_bytesize: 8

# tcp and rtu.
safety_unit_id: 1
safety_kind: coil          # coil (FC05) or register (FC06)
safety_address: 0

# relay only. numato is line-based ASCII ("relay on 0"), which you can drive
# from a shell with echo to prove the wiring before trusting the software.
# lcus is the four-byte CH340 dialect.
safety_relay_protocol: numato
safety_relay_channel: 0

safety_interval: 0.1       # seconds between permit renewals
safety_stale_after: 0.5    # vision result older than this stops renewals

# Issue permits without first proving the machine cannot run. Leave false:
# arming automatically after a crash is what a safety output must not do.
# Arm deliberately instead, with SIGUSR1.
safety_auto_arm: false

# --- machine state, read only ---------------------------------------------
# Polls a variable-frequency drive over Modbus RTU for context: running or
# stopped, output current, fault trips. It has no write path at all, and must
# not share a device with the safety output above -- the two are deliberately
# separate hardware so that a bug in the reader cannot reach the machine.
#
# Worth having because it tells you afterwards whether the saw was actually
# cutting when someone looked away, which the attention state alone cannot.
machine_port: ""           # e.g. /dev/ttyUSB0; empty disables
machine_baud: 9600
machine_parity: N
machine_stopbits: 1
machine_bytesize: 8
machine_unit_id: 1
machine_interval: 1.0      # seconds between polls

# Added to every documented register address. Several drives, LS Electric
# among them, document an address one higher than the number that goes on the
# wire. Get this wrong and the reads succeed and return the neighbouring
# register, which looks plausible and is not.
machine_address_offset: -1

# Gaze smoothing (0-1]. Lower is steadier but slower to react.
filter_alpha: 0.12

# --- calibration ----------------------------------------------------------
# Commissioning only: the four corners are captured once and reloaded on every
# start. Redo with --recalibrate, discard with --factory-reset.
sample_duration: 1.0    # seconds of fixation per corner
sigma_threshold: 0.05   # reject a corner that wobbles more than this
# calibration_file: /var/lib/gaze_monitor/calibration.json
