[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-monitor"
version = "0.3.0"
description = "Camera-based operator attention monitor for machinery danger zones"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Loose ranges describe what the package is compatible with.
# requirements.txt holds the exact, verified deployment pins.
dependencies = [
    "numpy>=1.24,<2",
    "opencv-contrib-python>=4.9",
    "mediapipe>=0.10.14,<0.11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 2.57 is the floor: earlier releases cannot open a D435i on a kernel
# without CONFIG_HID_SENSOR_HUB. See requirements-realsense.txt.
realsense = ["pyrealsense2>=2.57"]

[project.scripts]
gaze-demo = "demo:main"

[tool.setuptools]
packages = ["gaze_monitor"]
# demo.py is a top-level module, not part of the package. Without this it
# is left out of the wheel and the gaze-demo entry point above points at
# nothing.
py-modules = ["demo"]

[tool.black]
line-length = 88
# Pin the target explicitly. Left to inference from requires-python,
# black targets the newest Python in the range and emits syntax that
# older interpreters in the CI matrix cannot parse.
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", "__pycache__"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus line-length, imports, bugbear and pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
