# Operator attention monitor.
#
#   Desktop development (x86_64, RealSense over USB):
#       xhost +local:docker          # once per login, for the calibration UI
#       docker compose up gaze
#
#   Jetson Orin Nano Super:
#       docker compose --profile jetson pull gaze-jetson        # from GHCR
#       docker compose --profile calibrate run --rm calibrate   # once
#       docker compose --profile jetson up -d gaze-jetson
#
# The Jetson image is built and published by CI (.github/workflows/ci.yml), so
# the board pulls it rather than building it. To build it locally anyway:
#
#       docker compose --profile jetson build gaze-jetson
#
# Calibration lives in the gaze-calibration volume and is shared by all three
# services, so the unit is commissioned once and every later start reuses it.
#
# Every service mounts the host's /etc/localtime and /etc/timezone read-only,
# so container log timestamps are in the board's local time rather than UTC.
# Without it a log line has to be mentally shifted before it can be compared
# against anything else on the machine -- a monitoring dashboard, the host's
# own journal, or the time an operator says something happened. glibc reads
# /etc/localtime directly, so this works without tzdata in the image.

x-realsense-device-access: &realsense-device-access
  # The pyrealsense2 wheels use the V4L2 backend, not RSUSB, so the container
  # needs the /dev/video* nodes and not just /dev/bus/usb. The whole of /dev is
  # bind-mounted because those nodes renumber across replugs and reboots, and a
  # fixed `devices:` list would silently point at the wrong one. The cgroup
  # rules grant video4linux (81) and USB (189) character devices, which is what
  # makes this work without `privileged: true`.
  #
  # No kernel modules are involved either way, which is just as well: a
  # container cannot load them. The IMU is a separate matter -- see
  # requirements-realsense.txt.
  device_cgroup_rules:
    - "c 81:* rmw"
    - "c 189:* rmw"

services:
  # x86_64 development and calibration, with a window on the host display.
  gaze:
    build:
      context: .
      target: x86
    image: gaze-monitor:x86
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - gaze-calibration:/var/lib/gaze_monitor
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
    restart: "no"

  # The installed unit: no display, annunciation through the log.
  gaze-jetson:
    profiles: ["jetson"]
    build:
      context: .
      target: jetson
      args:
        L4T_TAG: ${L4T_TAG:-r36.2.0}
    # Published by CI. Override GAZE_JETSON_IMAGE to run a local build or a
    # pinned jetson-<sha> tag instead of whatever `jetson` currently points at.
    image: ${GAZE_JETSON_IMAGE:-ghcr.io/bauer-san/gaze:jetson}
    # Requires the NVIDIA container runtime from JetPack. It is what mounts the
    # host's Tegra userspace into the container, which the CSI source needs.
    runtime: nvidia
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
    # Prometheus exporter (metrics_port in config.example.yaml). Only the
    # long-running services publish it; the one-off calibration runs would
    # collide with this one for the host port.
    ports:
      - "${GAZE_METRICS_PORT:-9091}:9091"
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gaze-calibration:/var/lib/gaze_monitor
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --headless
    # An attention monitor that has exited is indistinguishable from one that
    # is quiet because nothing is wrong. Restart it, and watch the logs.
    restart: unless-stopped

  # A small form factor PC as the installed unit -- an HP EliteDesk Mini or
  # similar. No GPU is involved (MediaPipe runs on the CPU through XNNPACK),
  # and an x86 CPU with AVX2 outruns the Jetson at this workload, so the
  # default filter_alpha tuned for 30 fps is the right one here.
  #
  #     docker compose --profile x86 pull gaze-x86
  #     docker compose --profile calibrate-x86 run --rm calibrate-x86   # once
  #     docker compose --profile x86 up -d gaze-x86
  gaze-x86:
    profiles: ["x86"]
    build:
      context: .
      target: x86
    image: ${GAZE_X86_IMAGE:-ghcr.io/bauer-san/gaze:x86}
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
    ports:
      - "${GAZE_METRICS_PORT:-9091}:9091"
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gaze-calibration:/var/lib/gaze_monitor
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --headless
    restart: unless-stopped

  # Commissioning on a small form factor PC, over ssh.
  calibrate-x86:
    profiles: ["calibrate-x86"]
    image: ${GAZE_X86_IMAGE:-ghcr.io/bauer-san/gaze:x86}
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gaze-calibration:/var/lib/gaze_monitor
    tty: true
    stdin_open: true
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --recalibrate
      - --tui
    restart: "no"

  # Raspberry Pi 4, 64-bit Raspberry Pi OS. No NVIDIA runtime and no Tegra
  # userspace to mount -- a Pi is a plain arm64 box. Frame rate is materially
  # lower than the Jetson's, so --alpha raises the gaze smoothing to match:
  # filter_alpha is per frame while every threshold is in seconds, and at a low
  # frame rate the default lags longer than warn_after. See README.md.
  #
  #     docker compose --profile pi pull gaze-pi
  #     docker compose --profile calibrate-pi run --rm calibrate-pi   # once
  #     docker compose --profile pi up -d gaze-pi
  gaze-pi:
    profiles: ["pi"]
    build:
      context: .
      target: pi
    image: ${GAZE_PI_IMAGE:-ghcr.io/bauer-san/gaze:pi}
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
    ports:
      - "${GAZE_METRICS_PORT:-9091}:9091"
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gaze-calibration:/var/lib/gaze_monitor
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --alpha
      - "0.35"
      - --headless
    restart: unless-stopped

  # Commissioning on a Pi, over ssh. Same procedure as calibrate-tui.
  calibrate-pi:
    profiles: ["calibrate-pi"]
    image: ${GAZE_PI_IMAGE:-ghcr.io/bauer-san/gaze:pi}
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gaze-calibration:/var/lib/gaze_monitor
    tty: true
    stdin_open: true
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --recalibrate
      - --tui
    restart: "no"

  # One-off commissioning run over ssh: prompts and a status line in the
  # terminal, no display needed. `run` (not `up`) is required -- this wants a
  # terminal, which is what tty/stdin_open below provide.
  #
  #     docker compose --profile calibrate-tui run --rm calibrate-tui
  #
  # The operator marks the four corners of the machine's danger area, not of
  # any screen, so nothing is lost by not having one.
  calibrate-tui:
    profiles: ["calibrate-tui"]
    image: ${GAZE_JETSON_IMAGE:-ghcr.io/bauer-san/gaze:jetson}
    runtime: nvidia
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - gaze-calibration:/var/lib/gaze_monitor
    # Both are needed: the terminal UI refuses to start without a tty, rather
    # than silently drawing a status line nobody can see or read keys nobody
    # can send.
    tty: true
    stdin_open: true
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --recalibrate
      - --tui
    restart: "no"

  # One-off commissioning run with a display; on the Jetson that is the
  # dev kit's own HDMI output.
  calibrate:
    profiles: ["calibrate"]
    image: ${GAZE_JETSON_IMAGE:-ghcr.io/bauer-san/gaze:jetson}
    runtime: nvidia
    <<: *realsense-device-access
    environment:
      GAZE_CALIBRATION_FILE: /var/lib/gaze_monitor/calibration.json
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - gaze-calibration:/var/lib/gaze_monitor
    command:
      - python3
      - demo.py
      - --config
      - config.example.yaml
      - --source
      - realsense
      - --recalibrate
      - --fullscreen
    restart: "no"

volumes:
  gaze-calibration:
